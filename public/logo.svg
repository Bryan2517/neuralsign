<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brain-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Brain shape -->
  <path 
    d="M50 10C35 10 25 20 25 35C15 35 10 45 10 55C10 70 20 80 35 80C35 85 40 90 50 90C60 90 65 85 65 80C80 80 90 70 90 55C90 45 85 35 75 35C75 20 65 10 50 10Z" 
    fill="url(#brain-gradient)"
  />
  
  <!-- Neural connections -->
  <circle cx="35" cy="45" r="4" fill="white" opacity="0.8"/>
  <circle cx="50" cy="35" r="4" fill="white" opacity="0.8"/>
  <circle cx="65" cy="45" r="4" fill="white" opacity="0.8"/>
  <circle cx="40" cy="60" r="4" fill="white" opacity="0.8"/>
  <circle cx="60" cy="60" r="4" fill="white" opacity="0.8"/>
  <circle cx="50" cy="70" r="4" fill="white" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="35" y1="45" x2="50" y2="35" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="35" x2="65" y2="45" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="35" y1="45" x2="40" y2="60" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="65" y1="45" x2="60" y2="60" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="60" x2="50" y2="70" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="60" x2="50" y2="70" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="60" x2="60" y2="60" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
